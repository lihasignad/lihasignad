<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="100%" height="30">
  <defs>
    <linearGradient id="manga-div" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="50" y1="15" x2="850" y2="15" stroke="url(#manga-div)" stroke-width="2"/>
  
  <!-- Inked Diamond & Speedline Nodes -->
  <g transform="translate(450, 15)">
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#ffffff"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#000000"/>
    <circle cx="-30" cy="0" r="3" fill="#ffffff"/>
    <circle cx="30" cy="0" r="3" fill="#ffffff"/>
    <line x1="-60" y1="0" x2="-40" y2="0" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="60" y2="0" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
