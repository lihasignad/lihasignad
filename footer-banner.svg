<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <pattern id="footer-screentone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1000" height="160" rx="10" fill="url(#footer-bg)"/>
  <rect width="1000" height="160" rx="10" fill="url(#footer-screentone)"/>
  
  <!-- Outer Frame -->
  <rect x="8" y="8" width="984" height="144" rx="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="12" y="12" width="976" height="136" rx="6" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Speedline Accents -->
  <line x1="30" y1="30" x2="300" y2="30" stroke="#ffffff" stroke-width="1"/>
  <line x1="700" y1="30" x2="970" y2="30" stroke="#ffffff" stroke-width="1"/>
  <line x1="30" y1="130" x2="300" y2="130" stroke="#ffffff" stroke-width="1"/>
  <line x1="700" y1="130" x2="970" y2="130" stroke="#ffffff" stroke-width="1"/>

  <!-- Kanji & Call-sign -->
  <g text-anchor="middle" fill="#ffffff">
    <text x="500" y="55" font-family="'Noto Sans JP', sans-serif" font-size="26" font-weight="900" letter-spacing="8">「 自由の翼 // WINGS OF FREEDOM 」</text>
    <text x="500" y="88" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" letter-spacing="5">SAHIL DANGI // @LIHASIGNAD</text>
    <text x="500" y="118" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#aaaaaa" letter-spacing="3">BUILDING WITH PASSION ✦ ALWAYS MOVING FORWARD ✦ OPEN TO COLLABORATION</text>
  </g>
</svg>
